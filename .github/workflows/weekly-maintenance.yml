name: Weekly maintenance

on:
  schedule:
    # Mondays at 14:23 UTC
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  # Pi runs in a Docker Sandbox with no GitHub or model credentials inside it; see the reusable
  # workflow.
  update:
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
      id-token: write
    uses: kernel/security-workflows/.github/workflows/sandboxed-agent.yml@main
    with:
      prompt-file: .github/workflows/weekly-maintenance-prompt.md
      prompt-vars: POOL_NAME
      # workflows: write lets the agent push the evergreen branch after merging a main that
      # changed .github/workflows/.
      app-permissions: '{"actions":"write","contents":"write","pull_requests":"write","workflows":"write"}'
      merge: true
      evergreen-branch: automation/weekly-maintenance
      timeout-minutes: 240
      env: |
        POOL_NAME=weekly-maintenance-${{ github.run_id }}
      setup: |
        curl -LsSf https://astral.sh/uv/install.sh | sudo env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh
        sudo npm install -g --silent @onkernel/cli
        kernel --version
        uv --version
    secrets:
      ADMIN_APP_ID: ${{ secrets.ADMIN_APP_ID }}
      ADMIN_APP_PRIVATE_KEY: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
      AGENT_SECRETS: |
        CURSOR_API_KEY=${{ secrets.CURSOR_API_KEY }}
        KERNEL_API_KEY=${{ secrets.KERNEL_API_KEY }}
        TINKER_API_KEY=${{ secrets.TINKER_API_KEY }}

  delete-pool:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete the smoke-test browser pool
        env:
          KERNEL_API_KEY: ${{ secrets.KERNEL_API_KEY }}
          POOL_NAME: weekly-maintenance-${{ github.run_id }}
        run: npx --yes @onkernel/cli browser-pools delete "$POOL_NAME" --force || true
