[project]
name = "kernel-tinker-rl"
version = "0.1.0"
description = "Train browser agents with RL using the Kernel Browser REPL and Tinker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "chz>=0.4.0",
    "kernel>=0.130.0",
    "matplotlib>=3.10.8",
    "openai>=2.13.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "tinker>=0.36.0",
    "tinker-cookbook>=0.5.8",
    "wandb>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0"]

[project.urls]
Documentation = "https://www.kernel.sh/docs"
Repository = "https://github.com/kernel/kernel-tinker-rl"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
